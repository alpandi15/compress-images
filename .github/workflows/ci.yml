name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # macOS decodes HEIC/AVIF with the system ImageIO framework: no codec libraries needed.
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config cmake libheif-dev libde265-dev libdav1d-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ hashFiles('.github/scripts/vcpkg-windows.ps1') }}

      - name: libheif + dav1d via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/vcpkg-windows.ps1

      # The Tauri crate embeds app/dist at compile time, so the frontend is built first.
      - name: Frontend (install, type-check, build)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test without native codecs
        run: cargo test --workspace --no-default-features

      # Release builds on Linux compile libheif in (see release.yml); test that variant too.
      - name: Test with embedded libheif (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p compress-core --features heic-embedded

  msrv:
    name: MSRV (core + CLI 1.88, app 1.90)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config libheif-dev libdav1d-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: cd app && pnpm install --frozen-lockfile && pnpm build
      - run: cargo +1.88 check -p compress-core -p compress-images --all-targets
      - run: cargo +1.90 check -p compress-images-app --all-targets

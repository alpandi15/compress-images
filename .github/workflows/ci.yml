name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            features: ""
          - os: ubuntu-24.04
            features: ""
          # HEIC/AVIF decode on Windows needs vcpkg-provided libheif/dav1d (SPEC §7.3, v0.4).
          - os: windows-latest
            features: "--no-default-features"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm libheif dav1d pkg-config

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config libheif-dev libdav1d-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev

      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      # The Tauri crate embeds app/dist at compile time, so the frontend is built first.
      - name: Frontend (install, type-check, build)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

      - name: Test
        run: cargo test --workspace ${{ matrix.features }}

      - name: Test without native codecs
        if: matrix.features == ''
        run: cargo test --workspace --no-default-features

  msrv:
    name: MSRV (core + CLI 1.88, app 1.90)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config libheif-dev libdav1d-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: cd app && pnpm install --frozen-lockfile && pnpm build
      - run: cargo +1.88 check -p compress-core -p compress-images --all-targets
      - run: cargo +1.90 check -p compress-images-app --all-targets

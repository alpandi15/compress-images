[package]
name = "compress-images-app"
description = "Compress Images desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.90" # Tauri 2.12 requires 1.90; core and CLI stay at the workspace MSRV

[features]
default = ["heic", "avif-decode"]
heic = ["compress-core/heic"]
avif-decode = ["compress-core/avif-decode"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
compress-core.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml = "1.2.1"
tracing.workspace = true
tracing-subscriber.workspace = true

# macOS uses its own race-free implementation (src/mac_single_instance.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile.workspace = true

[package]
name = "compress-core"
description = "Image compression engine for Compress Images"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["heic", "avif-decode"]
# On macOS both decode through the system's ImageIO framework, so release builds need no
# bundled native libraries; elsewhere they use libheif and dav1d (SPEC §6.5).
heic = ["dep:libheif-rs", "imageio"]
avif-decode = ["dep:image-avif-native", "imageio"]
# Compiles libheif from source (decoders built in, no plugins) instead of using the system
# copy; used for Linux release builds so the AppImage works (SPEC §7.3). No effect on macOS.
heic-embedded = ["heic", "libheif-rs?/embedded-libheif"]
# Internal: the macOS ImageIO backend shared by `heic` and `avif-decode`.
imageio = ["dep:objc2-core-foundation", "dep:objc2-core-graphics", "dep:objc2-image-io"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp"] }
mozjpeg = "0.10.13"
imagequant = { version = "4.4.1", default-features = false, features = ["threads"] }
png = "0.18.1"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
webp = { version = "0.3.1", default-features = false }
ravif = "0.13.0"
rgb = "0.8.50"
tiff = "0.11.3"
fast_image_resize = { version = "6.1.0", features = ["image"] }
rayon = "1.12.0"
walkdir = "2.5.0"
dunce = "1.0.5"
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
libheif-rs = { version = "3.0.0", optional = true, default-features = false, features = ["v1_17"] }
# Switches on the dav1d-based AVIF decoder of `image` (see that crate's Cargo.toml).
image-avif-native = { path = "../image-avif-native", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", optional = true }
objc2-core-graphics = { version = "0.3.2", optional = true }
objc2-image-io = { version = "0.3.2", optional = true }

[dev-dependencies]
dunce = "1.0.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp"] }
walkdir = "2.5.0"
